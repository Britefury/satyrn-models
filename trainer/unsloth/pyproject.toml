[project]
name = "satyrn-unsloth"
version = "0.1.0"
description = "Satyrn Unsloth Trainer"
requires-python = ">=3.13.9,<3.14"
dependencies = [
    "unsloth==2026.10.6",
    "unsloth-zoo==2026.10.6",
    "pydantic",
    "python-dotenv",
    "hydra-core>=1.4.0.dev8",
    "omegaconf>=2.4.0.dev13",
    "jinja2",
    "mlflow==3.15.1",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "pyrsmi>=1.1.0",
    "inspect-ai==0.3.260",
    "inspect-evals==0.19.0",
    "agent-client-protocol==0.12.1",
    # trl 1.7.0 (pinned in uv.toml) supports vLLM 0.14.0 to 0.23.0; newer vLLM also needs torch 2.13.
    "vllm==0.23.0 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff==0.16.2"]

[project.scripts]
satyrn-unsloth = "satyrn.trainer.unsloth.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn"]
